<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>xterm.js TUI Login — Decoupled</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #1e1e1e;
        overflow: hidden;
      }
      #terminal {
        width: 100%;
        height: 100%;
      }
      #terminal .xterm,
      #terminal .xterm-viewport,
      #terminal .xterm-screen {
        width: 100% !important;
        height: 100% !important;
      }
    </style>
  </head>
  <body>
    <div id="terminal"></div>
    <script type="module" src="./browser.ts"></script>
  </body>
</html>
